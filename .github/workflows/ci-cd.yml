name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/carrental-web
  DOCKERHUB_MYSQL_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/carrental-mysql

jobs:
  lint-and-validate:
    name: Lint PHP & validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: PHP syntax check
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find app -name "*.php" -print0)
          exit $status

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas k8s/*.yaml

  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.DOCKERHUB_WEB_IMAGE }}:latest
            ${{ env.DOCKERHUB_WEB_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push mysql image
        uses: docker/build-push-action@v6
        with:
          context: ./mysql
          push: true
          tags: |
            ${{ env.DOCKERHUB_MYSQL_IMAGE }}:latest
            ${{ env.DOCKERHUB_MYSQL_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes (EC2)
    runs-on: [self-hosted]
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kubectl access
        run: kubectl config current-context && kubectl get nodes

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Roll out new web image
        run: |
          kubectl set image deployment/carrental-web \
            carrental-web=${{ env.DOCKERHUB_WEB_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n carrental
          kubectl rollout status deployment/carrental-web -n carrental --timeout=180s
