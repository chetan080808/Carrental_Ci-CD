name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/carrental-web
  DOCKERHUB_MYSQL_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/carrental-mysql

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Lint & validate (runs on every push and PR)
  # ─────────────────────────────────────────────────────────────
  lint-and-validate:
    name: Lint PHP & validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: PHP syntax check
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find app -name "*.php" -print0)
          exit $status

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas k8s/*.yaml

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Build → scan → push (main branch only)
  # Images are scanned BEFORE they reach Docker Hub.
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build, scan & push Docker images
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Web image ──────────────────────────────────────────────
      - name: Build web image (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          push: false
          tags: ${{ env.DOCKERHUB_WEB_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan web image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0   # pin to a release; check for the latest version
        with:
          image-ref: ${{ env.DOCKERHUB_WEB_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # report only; change to "1" to block vulnerable images

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.DOCKERHUB_WEB_IMAGE }}:latest
            ${{ env.DOCKERHUB_WEB_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha

      # ── MySQL image ────────────────────────────────────────────
      - name: Build mysql image (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./mysql
          load: true
          push: false
          tags: ${{ env.DOCKERHUB_MYSQL_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan mysql image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.DOCKERHUB_MYSQL_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Push mysql image
        uses: docker/build-push-action@v6
        with:
          context: ./mysql
          push: true
          tags: |
            ${{ env.DOCKERHUB_MYSQL_IMAGE }}:latest
            ${{ env.DOCKERHUB_MYSQL_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Deploy + smoke test (self-hosted runner on EC2)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes (EC2)
    runs-on: [self-hosted]
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kubectl access
        run: kubectl config current-context && kubectl get nodes

      - name: Set image tag in manifest
        run: |
          sed -i "s|image: .*carrental-web:.*|image: ${{ env.DOCKERHUB_WEB_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}|" \
            k8s/06-web-deployment.yaml
          grep -n "image:" k8s/06-web-deployment.yaml

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/carrental-web -n carrental --timeout=180s

      - name: Smoke test
        run: |
          kubectl run smoke-${{ github.run_id }} --rm -i --quiet --restart=Never \
            -n carrental --image=curlimages/curl -- \
            curl -sf --retry 5 --retry-delay 3 --retry-all-errors \
            -o /dev/null -w "%{http_code}\n" http://carrental-web/car-listing.php