apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: carrental
  labels:
    app: mysql
spec:
  replicas: 1             # MySQL should always be single replica with PVC
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate        # Recreate ensures old pod stops before new one starts (needed for PVC)
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
        # Downloads carrental.sql from GitHub into a shared volume.
        # MySQL picks it up from /docker-entrypoint-initdb.d on first boot.
        - name: download-sql
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              curl -L -o /init-sql/carrental.sql \
                https://raw.githubusercontent.com/chetan080808/docker-k8s-carrental/main/mysql/carrental.sql
              echo "SQL downloaded successfully"
          volumeMounts:
            - name: init-sql
              mountPath: /init-sql
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: carrental-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d   # MySQL auto-imports any .sql file here on first boot
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: init-sql
          emptyDir: {}    # Shared between init container and mysql container
